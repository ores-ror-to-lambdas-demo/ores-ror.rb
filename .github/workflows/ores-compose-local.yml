name: ores-compose-local

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rails/Graal application
        uses: actions/checkout@v4
      - name: Checkout current ores-compose
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-compose
          path: _tools/ores-compose
      - name: Build ores-compose from source
        run: cargo build --release --locked --manifest-path _tools/ores-compose/Cargo.toml
      - name: Validate local deployment script syntax
        run: bash -n bin/clone-build-deploy-local.sh
      - name: Validate ores-compose contract
        run: _tools/ores-compose/target/release/ores-compose check .ores-compose.yaml
      - name: Print deterministic local startup plan
        run: _tools/ores-compose/target/release/ores-compose plan .ores-compose.yaml
