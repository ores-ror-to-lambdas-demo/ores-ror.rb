name: dual-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-mri-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Audit app and transitive gem execution-local state
        run: |
          bundle exec ruby script/audit-thread-state.rb app lib config $(bundle list --paths) > thread-state-audit.json
          cat thread-state-audit.json
      - name: Boot normal Puma/Rails server
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3100 >rails-mri.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 45); do
            if curl --fail --silent -D health.headers -H 'accept: application/json' -H 'x-request-id: rails-mri-smoke' http://127.0.0.1:3100/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          cat health.headers
          grep -qi '^x-ores-runtime: ruby' health.headers
          grep -qi '^x-ores-execution-mode: rails' health.headers
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-mri.log || true

  rails-truffleruby-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Boot the normal Rails application on TruffleRuby
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3101 >rails-truffle.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 60); do
            if curl --fail --silent -D health.headers -H 'accept: application/json' -H 'x-request-id: rails-truffle-smoke' http://127.0.0.1:3101/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          cat health.headers
          grep -qi '^x-ores-runtime: truffleruby' health.headers
          grep -qi '^x-ores-execution-mode: rails' health.headers
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-truffle.log || true

  rails-free-codegen:
    runs-on: ubuntu-latest
    env:
      ORES_INFRA_ROOT: ${{ github.workspace }}/.ores-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.infra
          ref: main
          path: .ores-infra
      - name: Prove runtime folders moved out of app repo
        run: |
          test ! -e graal
          test ! -e aws-lambda
          test -f .ores-infra/graal/bootstrap.rb
          test -f .ores-infra/aws-lambda/Dockerfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Prove route compiler handles Rails DSL without Rails
        run: |
          ruby script/static-route-compiler-smoke.rb
          ruby -e 'abort "Rails unexpectedly loaded" if defined?(Rails)'

      - name: Generate route-granularity Lambda artifacts without Rails
        env:
          ORES_BUILD_TARGET: lambda
          ORES_LAMBDA_HANDLER_GRANULARITY: route
        run: |
          ruby bin/build-runtime
          test -f generated/lambda/routes/users/'[id]'/_get/handler.rb
          test -f generated/lambda/routes/orders/'[id]'/cancel/_post/handler.rb
          grep -Fq '"rails_application_initialized": false' generated/lambda/manifest.json
          grep -Fq '"route_source": "config/routes.rb:ripper-static"' generated/lambda/manifest.json
          ruby -rjson -e 'm=JSON.parse(File.read("generated/lambda/manifest.json")); by=m.fetch("routes").to_h{|r|[r.fetch("name"),r.fetch("middleware")]}; raise unless by.fetch("user")==%w[request_id users_show_header]; raise unless by.fetch("cancel_order")==%w[request_id order_cancel_header]; raise unless by.fetch("search")==%w[request_id search_header]'
          grep -Fq '"model_file": "app/models/user.rb"' generated/lambda/manifest.json
          grep -Fq '"app/views/users/show/endpoint/show.json.erb"' generated/lambda/manifest.json
          grep -Fq '# --- APP MODEL app/models/user.rb (executed) ---' generated/lambda/routes/users/'[id]'/_get/handler.rb
          grep -Fq '# --- APP CONTROLLER app/controllers/users/show/endpoint_controller.rb (executed) ---' generated/lambda/routes/users/'[id]'/_get/handler.rb
          grep -Fq 'OresApp::EmbeddedViews.add({' generated/lambda/routes/users/'[id]'/_get/handler.rb
          grep -Fq 'app/controllers/users/show/endpoint_controller' routes/users/'[id]'/handler.rb
          grep -Fq 'Users::Show::EndpointController.call_ores_action("show", request)' routes/users/'[id]'/handler.rb
          grep -Fq '"controller_packaging": "direct-executable-source"' generated/lambda/manifest.json
          grep -Fq '"view_runtime": "actionview-native-in-memory"' generated/lambda/manifest.json
          ! grep -R -E 'config/environment|Rails\.application' generated/lambda

      - name: Generate group-granularity Lambda artifacts without Rails
        env:
          ORES_BUILD_TARGET: lambda
          ORES_LAMBDA_HANDLER_GRANULARITY: group
        run: |
          ruby bin/build-runtime
          test -f generated/lambda/groups/orders/handler.rb
          grep -Fq '"handler_granularity": "group"' generated/lambda/manifest.json
          grep -q 'case route.group' generated/lambda/entrypoint.rb
          ! grep -R -E 'config/environment|Rails\.application' generated/lambda

      - name: Generate route and group Graal isolate units without Rails
        env:
          ORES_BUILD_TARGET: graal
        run: |
          ruby bin/build-runtime
          test -f generated/graal/common.rb
          test -f generated/graal/routes/users/'[id]'/_get/handler.rb
          test -f generated/graal/groups/orders/handler.rb
          grep -Fq '"context_model": "one-long-lived-context-per-route-or-group-isolate"' generated/graal/manifest.json
          grep -Fq '"max_concurrency_per_isolate": 5' generated/graal/manifest.json
          grep -Fq '"contexts_per_isolate": 1' generated/graal/manifest.json
          grep -Fq '"host_thread_pool_size_per_context": 5' generated/graal/manifest.json
          grep -Fq '"language_context": "ruby"' generated/graal/manifest.json
          grep -Fq '"request_multiplexing": true' generated/graal/manifest.json
          grep -Fq '"route_handler_authority": "routes/**/handler.rb"' generated/graal/manifest.json
          grep -Fq '"runtime_adapter_repository": "ores-ror-to-lambdas-demo/ores-ror.infra"' generated/graal/manifest.json
          grep -Fq '# --- infra graal/bootstrap.rb ---' 'generated/graal/routes/users/[id]/_get/handler.rb'
          ruby -rjson -e 'm=JSON.parse(File.read("generated/graal/manifest.json")); by=m.fetch("routes").to_h{|r|[r.fetch("name"),r.fetch("middleware")]}; raise unless by.fetch("user")==%w[request_id users_show_header]; raise unless by.fetch("cancel_order")==%w[request_id order_cancel_header]; raise unless by.fetch("search")==%w[request_id search_header]'
          grep -Fq '"engine_scope": "process-shared"' generated/graal/manifest.json
          test -f 'routes/users/[id]/handler.rb'
          test -f 'routes/orders/[id]/cancel/handler.rb'
          grep -Fq '# --- PHYSICAL routes/users/[id]/handler.rb ---' 'generated/graal/routes/users/[id]/_get/handler.rb'
          grep -Fq '# --- APP MODEL app/models/user.rb (executed) ---' 'generated/graal/routes/users/[id]/_get/handler.rb'
          grep -Fq '# --- APP CONTROLLER app/controllers/users/show/endpoint_controller.rb (executed) ---' 'generated/graal/routes/users/[id]/_get/handler.rb'
          grep -Fq 'OresApp::EmbeddedViews.add({' 'generated/graal/routes/users/[id]/_get/handler.rb'
          grep -Fq 'Users::Show::EndpointController.call_ores_action("show", request)' 'routes/users/[id]/handler.rb'
          grep -Fq '"controller_packaging": "direct-executable-source"' generated/graal/manifest.json
          grep -Fq '"view_runtime": "actionview-native-in-memory"' generated/graal/manifest.json
          grep -Fq '"app/models/order.rb"' generated/graal/manifest.json
          grep -Fq '"app/views/orders/show/endpoint/show.json.erb"' generated/graal/manifest.json
          grep -Fq '"source_memory": "host-read-only-shareable"' generated/graal/manifest.json
          grep -Fq '"supported_isolation_granularities"' generated/graal/manifest.json
          ! grep -R -E 'config/environment|Rails\.application' generated/graal
          ruby -rjson -e 'm=JSON.parse(File.read("generated/graal/manifest.json")); r=m["routes"].size; units=m["isolate_units"]; raise unless units.count{|u|u["kind"]=="route"}==r; raise unless units.any?{|u|u["kind"]=="group" && u["group"]=="orders"}; raise unless units.all?{|u|u["context_count"]==1 && u["host_thread_pool_size"]==5 && u["request_multiplexing"]==true && u["language_context"]=="ruby"}; raise unless units.map{|u|u["key"]}.uniq.size==units.size'

  graal-warm-context:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails:test
      ORES_BUILD_TARGET: graal
      ORES_INFRA_ROOT: ${{ github.workspace }}/.ores-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.infra
          ref: main
          path: .ores-infra
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - run: bundle exec truffleruby bin/build-runtime
      - name: Reuse one route Context image for 1,000 invocations and prove cleanup
        run: |
          cat >/tmp/graal-smoke.rb <<'RUBY'
          require "json"

          host_http = lambda do |payload|
            request = JSON.parse(payload.to_s)
            Thread.current[:ores_ci_fiber_poison] = request.fetch("path")
            Thread.current.thread_variable_set(:ores_ci_thread_poison, request.fetch("path"))
            JSON.generate("ok" => true, "status" => 200, "body" => JSON.generate("ok" => true))
          end

          eval(File.read("generated/graal/common.rb"), TOPLEVEL_BINDING, "generated/graal/common.rb")
          unit = "generated/graal/routes/users/[id]/_get/handler.rb"
          factory = eval(File.read(unit), TOPLEVEL_BINDING, unit)
          raise "unit must return executable factory" unless factory.respond_to?(:call)
          invoker = factory.call(host_http)
          raise "setup must return invoker" unless invoker.respond_to?(:call)
          raise "Rails unexpectedly loaded" if defined?(Rails)

          Thread.current[:ores_ci_preexisting] = "keep-fiber"
          Thread.current.thread_variable_set(:ores_ci_preexisting_true, "keep-thread")

          errors = Queue.new
          threads = 5.times.map do |thread_index|
            Thread.new do
              Thread.current[:ores_ci_preexisting] = "keep-fiber-#{thread_index}"
              Thread.current.thread_variable_set(:ores_ci_preexisting_true, "keep-thread-#{thread_index}")
              100.times do |index|
                request_id = "graal-route-#{thread_index}-#{index}"
                response = JSON.parse(invoker.call(JSON.generate(
                  "request_id" => request_id,
                  "method" => "GET",
                  "path" => "/users/demo",
                  "headers" => {}
                )))
                raise response.inspect unless response.fetch("status") == 200
                raise "request id drift" unless response.dig("headers", "x-request-id") == request_id
                rendered = JSON.parse(response.fetch("body"))
                raise "native Action View/model output missing" unless rendered["ok"] == true
                raise "fiber-local leaked" unless Thread.current[:ores_ci_fiber_poison].nil?
                raise "true thread-local leaked" unless Thread.current.thread_variable_get(:ores_ci_thread_poison).nil?
                raise "preexisting fiber state destroyed" unless Thread.current[:ores_ci_preexisting] == "keep-fiber-#{thread_index}"
                raise "preexisting thread state destroyed" unless Thread.current.thread_variable_get(:ores_ci_preexisting_true) == "keep-thread-#{thread_index}"
              end
            rescue StandardError => error
              errors << error
            end
          end
          threads.each(&:join)
          raise errors.pop unless errors.empty?
          RUBY
          bundle exec truffleruby /tmp/graal-smoke.rb

      - name: Execute a generated route-group context with embedded models and views
        run: |
          cat >/tmp/graal-group-smoke.rb <<'RUBY'
          require "json"

          host_http = lambda do |payload|
            request = JSON.parse(payload.to_s)
            JSON.generate("ok" => true, "status" => 200, "body" => JSON.generate(
              "ok" => true,
              "resource" => request.fetch("path")
            ))
          end

          eval(File.read("generated/graal/common.rb"), TOPLEVEL_BINDING, "generated/graal/common.rb")
          unit = "generated/graal/groups/orders/handler.rb"
          factory = eval(File.read(unit), TOPLEVEL_BINDING, unit)
          invoker = factory.call(host_http)
          raise "Rails application unexpectedly loaded" if defined?(Rails)
          raise "order model not loaded" unless defined?(Order)
          raise "show controller not loaded" unless defined?(Orders::Show::EndpointController)
          raise "cancel controller not loaded" unless defined?(Orders::Cancel::EndpointController)

          %w[/orders/demo /orders/demo/cancel].each_with_index do |path, index|
            method = path.end_with?("/cancel") ? "POST" : "GET"
            response = JSON.parse(invoker.call(JSON.generate(
              "request_id" => "graal-group-#{index}",
              "method" => method,
              "path" => path,
              "headers" => {}
            )))
            raise response.inspect unless response.fetch("status") == 200
            rendered = JSON.parse(response.fetch("body"))
            raise rendered.inspect unless rendered["ok"] == true && rendered["resource"] == path
          end
          RUBY
          bundle exec truffleruby /tmp/graal-group-smoke.rb

  truffleruby-aws-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.infra
          ref: main
          path: .ores-infra
      - name: Prove Lambda runtime is infra-owned
        run: |
          test ! -e aws-lambda
          test -f .ores-infra/aws-lambda/Dockerfile
          test -f .ores-infra/aws-lambda/bootstrap
      - name: Build Lambda image without Rails bundle
        run: |
          docker build \
            --platform linux/amd64 \
            --build-context ores_infra=.ores-infra \
            -f .ores-infra/aws-lambda/Dockerfile \
            -t ores-ror-truffleruby-lambda:test \
            .
      - name: Verify Rails application gem is absent but controller/view components are present
        run: docker run --rm --entrypoint truffleruby ores-ror-truffleruby-lambda:test -e 'abort "rails gem present" unless Gem::Specification.find_all_by_name("rails").empty?; abort "actionpack missing" if Gem::Specification.find_all_by_name("actionpack").empty?; abort "actionview missing" if Gem::Specification.find_all_by_name("actionview").empty?'
      - name: Install AWS Lambda Runtime Interface Emulator
        run: |
          curl --fail --location --output aws-lambda-rie https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x aws-lambda-rie
      - name: Invoke generated health handler
        run: |
          docker run --rm -d --name ores-ror-lambda -p 9000:8080 -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" --entrypoint /aws-lambda-rie ores-ror-truffleruby-lambda:test /var/runtime/bootstrap
          for n in $(seq 1 60); do
            if curl --fail --silent -H 'content-type: application/json' -d @.ores-infra/aws-lambda/event-v2.json http://127.0.0.1:9000/2015-03-31/functions/function/invocations >lambda-response.json; then break; fi
            sleep 1
          done
          cat lambda-response.json
          grep -q '"statusCode":200' lambda-response.json
          grep -Fq '"x-ores-execution-mode":"lambda"' lambda-response.json
          grep -q '"x-ores-runtime":"truffleruby"' lambda-response.json
      - if: failure()
        run: docker logs ores-ror-lambda || true
      - if: always()
        run: docker rm -f ores-ror-lambda >/dev/null 2>&1 || true


  cross-runtime-all-routes:
    runs-on: ubuntu-latest
    env:
      ORES_INFRA_ROOT: ${{ github.workspace }}/.ores-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ores-ror-to-lambdas-demo/ores-ror.infra
          ref: main
          path: .ores-infra
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - name: Generate all Rails-free Graal route units
        env:
          ORES_BUILD_TARGET: graal
        run: bundle exec truffleruby bin/build-runtime
      - name: Export every Rails route in JSON and HTML with mocked data
        env:
          ORES_BUILD_TARGET: rails
          RAILS_ENV: test
        run: bundle exec rails runner script/rails-contract-export.rb /tmp/rails-contract.json
      - name: Export every Graal route in JSON and HTML without Rails
        env:
          ORES_BUILD_TARGET: graal
        run: bundle exec truffleruby script/graal-contract-export.rb /tmp/graal-contract.json
      - name: Prove exact cross-runtime routing middleware and representation parity
        run: |
          diff -u /tmp/rails-contract.json /tmp/graal-contract.json
          ruby -rjson -e 'rows=JSON.parse(File.read("/tmp/rails-contract.json")); routes=rows.map{|r|r.fetch("name")}.uniq; formats=rows.group_by{|r|r.fetch("name")}.transform_values{|v|v.map{|r|r.fetch("format")}.sort}; raise "expected >=15 routes, got #{routes.size}" unless routes.size >= 15; raise "missing html/json" unless formats.values.all?{|f|f==%w[html json]}; raise "expected two representations per route" unless rows.size == routes.size * 2; by=rows.group_by{|r|r.fetch("name")}; {"user"=>"users-show","cancel_order"=>"order-cancel","search"=>"search"}.each{|name,policy| by.fetch(name).each{|row| raise "#{name} middleware chain" unless row.fetch("middleware").length==2; raise "#{name} route policy" unless row.fetch("middleware_headers").fetch("x-ores-route-policy")==policy }}'
