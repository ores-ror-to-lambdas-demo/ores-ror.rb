name: dual-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-mri-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rails test
      - name: Boot real Puma/Rails server and smoke HTTP
        run: |
          RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3100 >rails-mri.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"ruby"' health.json
          curl --fail --silent -H 'x-request-id: rails-mri-smoke' http://127.0.0.1:3100/healthz >/dev/null
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-mri.log || true

  rails-truffleruby-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - run: ruby -v
      - run: bundle exec rails test
      - name: Boot the same Rails server directly on TruffleRuby/GraalVM
        run: |
          RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3101 >rails-truffle.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q 'truffleruby' health.json
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-truffle.log || true

  generated-graal-faas-no-rails:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails
      ORES_BUILD_TARGET: graal
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - name: Generate the single-source Graal worker bundle
        run: bundle exec truffleruby script/generate_faas_bundle.rb
      - name: Prove generated worker executes without Rails
        run: |
          cat >/tmp/graal-smoke.rb <<'RUBY'
          require "json"

          def gs_http(payload)
            request = JSON.parse(payload.to_s)
            JSON.generate(
              "ok" => true,
              "status" => 200,
              "body" => JSON.generate("proxied_path" => request.fetch("path"))
            )
          end

          source = File.read(".ores-generated/graal/handler.rb")
          invoker = eval(source, TOPLEVEL_BINDING, "generated-handler.rb")
          raise "Rails booted in FaaS path" if defined?(Rails)

          health = JSON.parse(invoker.call(JSON.generate(
            "request_id" => "graal-health",
            "method" => "GET",
            "path" => "/healthz"
          )))
          raise "health failed" unless health.fetch("status") == 200
          raise "wrong runtime" unless health.fetch("body").include?("truffleruby-graal")

          proxied = JSON.parse(invoker.call(JSON.generate(
            "request_id" => "graal-user",
            "method" => "GET",
            "path" => "/users/demo"
          )))
          raise "proxy failed" unless proxied.fetch("body").include?("/users/demo")

          puts health.fetch("body")
          puts proxied.fetch("body")
          RUBY
          bundle exec truffleruby /tmp/graal-smoke.rb

  truffleruby-aws-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda image with TruffleRuby native standalone
        run: docker build --platform linux/amd64 -f aws-lambda/Dockerfile -t ores-ror-truffleruby-lambda:test .
      - name: Verify FaaS image excludes Rails
        run: |
          docker run --rm --entrypoint sh ores-ror-truffleruby-lambda:test -c \
            'bundle exec truffleruby -e '\''raise "Rails installed" if Gem::Specification.find_all_by_name("rails").any?; puts RUBY_DESCRIPTION'\'''
      - name: Install AWS Lambda Runtime Interface Emulator
        run: |
          curl --fail --location --output aws-lambda-rie \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x aws-lambda-rie
      - name: Boot Lambda runtime locally and invoke shared health handler
        run: |
          docker run --rm -d --name ores-ror-lambda \
            -p 9000:8080 \
            -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" \
            --entrypoint /aws-lambda-rie \
            ores-ror-truffleruby-lambda:test /var/runtime/bootstrap
          for n in $(seq 1 60); do
            if curl --fail --silent \
              -H 'content-type: application/json' \
              -d @aws-lambda/event-v2.json \
              http://127.0.0.1:9000/2015-03-31/functions/function/invocations >lambda-response.json; then
              break
            fi
            sleep 1
          done
          cat lambda-response.json
          grep -q '"statusCode":200' lambda-response.json
          grep -q 'truffleruby-aws-lambda' lambda-response.json
      - name: Show Lambda container log on failure
        if: failure()
        run: docker logs ores-ror-lambda || true
      - name: Stop Lambda container
        if: always()
        run: docker rm -f ores-ror-lambda >/dev/null 2>&1 || true
