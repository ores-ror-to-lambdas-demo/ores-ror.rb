name: dual-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-mri-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Boot normal Puma/Rails server
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3100 >rails-mri.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 45); do
            if curl --fail --silent -H 'x-request-id: rails-mri-smoke' http://127.0.0.1:3100/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"ruby"' health.json
          grep -q '"execution_mode":"rails"' health.json
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-mri.log || true

  rails-truffleruby-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - run: ruby -v
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Boot the same Rails application directly on TruffleRuby
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test bundle exec rails server -b 127.0.0.1 -p 3101 >rails-truffle.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q 'truffleruby' health.json
          grep -q '"execution_mode":"rails"' health.json
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-truffle.log || true

  lambda-route-codegen:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails
      ORES_BUILD_TARGET: lambda
      ORES_LAMBDA_HANDLER_GRANULARITY: route
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify no authored lambda route tree
        run: test ! -d routes
      - run: ruby bin/build-runtime
      - name: Verify Rails-free generated controller/view route adapters
        run: |
          test -f 'generated/lambda/routes/users/[id]/handler.rb'
          test -f 'generated/lambda/routes/orders/[id]/handler.rb'
          test -f 'generated/lambda/routes/orders/[id]/cancel/handler.rb'
          test -f 'generated/lambda/routes/profiles/[id]/preferences/handler.rb'
          test "$(find generated/lambda/routes -name handler.rb | wc -l)" -eq 13
          grep -Fq 'RAILS_CONTROLLER = "UsersController"' 'generated/lambda/routes/users/[id]/handler.rb'
          grep -Fq 'CONTROLLER = OresApp::Controllers::Users' 'generated/lambda/routes/users/[id]/handler.rb'
          grep -Fq 'ACTION = :show' 'generated/lambda/routes/users/[id]/handler.rb'
          grep -Fq 'VIEW = "users/show"' 'generated/lambda/routes/users/[id]/handler.rb'
          grep -Fq 'RAILS_CONTROLLER = "OrdersController"' 'generated/lambda/routes/orders/[id]/cancel/handler.rb'
          grep -Fq 'ACTION = :cancel' 'generated/lambda/routes/orders/[id]/cancel/handler.rb'
          grep -Fq 'VIEW = "orders/cancel"' 'generated/lambda/routes/orders/[id]/cancel/handler.rb'
          grep -Fq '"rails_boot": false' generated/lambda/manifest.json
          grep -Fq '"dispatch": "generated-plain-ruby-controller-view"' generated/lambda/manifest.json
          ! grep -R -E 'config/environment|Rails\.application|ActionController|ActionView' generated/lambda
          test -z "$(git status --porcelain --untracked-files=all -- generated/)"
      - run: bundle exec ruby lambda-test/thread_state_boundary_smoke.rb
      - run: bundle exec ruby lambda-test/aws_lambda_adapter_test.rb

  lambda-group-codegen:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails
      ORES_BUILD_TARGET: lambda
      ORES_LAMBDA_HANDLER_GRANULARITY: group
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: ruby bin/build-runtime
      - name: Verify grouped Rails-free dispatch build
        run: |
          grep -q '"handler_granularity": "group"' generated/lambda/manifest.json
          grep -q 'case route.name' generated/lambda/groups/orders/handler.rb
          grep -q 'OresGenerated::Groups::Orders' generated/lambda/entrypoint.rb
          grep -Fq 'require_relative "../../routes/orders/[id]/handler"' generated/lambda/groups/orders/handler.rb
          ! grep -R -E 'config/environment|Rails\.application|ActionController|ActionView' generated/lambda
      - run: bundle exec ruby lambda-test/thread_state_boundary_smoke.rb
      - run: bundle exec ruby lambda-test/aws_lambda_adapter_test.rb

  truffleruby-aws-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda image without Rails bundle
        run: docker build --platform linux/amd64 -f aws-lambda/Dockerfile -t ores-ror-truffleruby-lambda:test .
      - name: Verify container runtime line
        run: docker run --rm --entrypoint truffleruby ores-ror-truffleruby-lambda:test --version | tee truffleruby-version.txt
      - name: Prove Rails gem is absent from lambda image
        run: |
          docker run --rm --entrypoint truffleruby ores-ror-truffleruby-lambda:test \
            -e 'abort "rails gem present" unless Gem::Specification.find_all_by_name("rails").empty?'
      - name: Install AWS Lambda Runtime Interface Emulator
        run: |
          curl --fail --location --output aws-lambda-rie \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x aws-lambda-rie
      - name: Boot Lambda runtime locally and invoke generated health handler
        run: |
          docker run --rm -d --name ores-ror-lambda \
            -p 9000:8080 \
            -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" \
            --entrypoint /aws-lambda-rie \
            ores-ror-truffleruby-lambda:test /var/runtime/bootstrap
          for n in $(seq 1 60); do
            if curl --fail --silent \
              -H 'content-type: application/json' \
              -d @aws-lambda/event-v2.json \
              http://127.0.0.1:9000/2015-03-31/functions/function/invocations >lambda-response.json; then
              break
            fi
            sleep 1
          done
          cat lambda-response.json
          grep -q '"statusCode":200' lambda-response.json
          grep -Fq '\"execution_mode\":\"lambda\"' lambda-response.json
          grep -q 'truffleruby' lambda-response.json
      - name: Show Lambda container log on failure
        if: failure()
        run: docker logs ores-ror-lambda || true
      - name: Stop Lambda container
        if: always()
        run: docker rm -f ores-ror-lambda >/dev/null 2>&1 || true
