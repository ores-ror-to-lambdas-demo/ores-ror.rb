name: dual-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-mri-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Boot normal Puma/Rails server
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test RAILS_MIN_THREADS=4 RAILS_MAX_THREADS=16 bundle exec rails server -b 127.0.0.1 -p 3100 >rails-mri.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 45); do
            if curl --fail --silent -H 'x-request-id: rails-mri-smoke' http://127.0.0.1:3100/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"runtime":"ruby"' health.json
          grep -q '"execution_mode":"rails"' health.json
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-mri.log || true

  rails-truffleruby-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: true
      - run: ORES_BUILD_TARGET=rails bundle exec rails test
      - name: Boot the same Rails application directly on TruffleRuby
        run: |
          ORES_BUILD_TARGET=rails RAILS_ENV=test RAILS_MIN_THREADS=4 RAILS_MAX_THREADS=16 bundle exec rails server -b 127.0.0.1 -p 3101 >rails-truffle.log 2>&1 &
          echo $! > rails.pid
          for n in $(seq 1 60); do
            if curl --fail --silent -H 'x-request-id: rails-truffle-smoke' http://127.0.0.1:3101/healthz >health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q 'truffleruby' health.json
          grep -q '"execution_mode":"rails"' health.json
          kill $(cat rails.pid)
      - if: failure()
        run: cat rails-truffle.log || true

  lambda-route-codegen:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails
      ORES_BUILD_TARGET: lambda
      ORES_LAMBDA_HANDLER_GRANULARITY: route
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify Rails-first endpoint controller layout
        run: |
          test -f app/controllers/users/show/users_controller.rb
          test -f app/controllers/orders/cancel/orders_controller.rb
          test -f app/controllers/checkout_sessions/create/checkout_sessions_controller.rb
          test ! -e app/controllers/users/show/handler.rb
          test ! -e app/controllers/orders/cancel/handler.rb
          test -z "$(git ls-files 'app/controllers/**/handler.rb')"
      - run: ruby bin/build-runtime
      - name: Verify generated sibling handlers stay outside version control
        run: |
          test -f app/controllers/users/show/handler.rb
          test -f app/controllers/orders/cancel/handler.rb
          test -f app/controllers/profiles/preferences/handler.rb
          grep -Fq '"generated_handler": "app/controllers/users/show/handler.rb"' generated/lambda/manifest.json
          grep -Fq '"source_controller": "app/controllers/users/show/users_controller.rb"' generated/lambda/manifest.json
          git check-ignore app/controllers/users/show/handler.rb
          git check-ignore app/controllers/orders/cancel/handler.rb
          test -z "$(git ls-files 'app/controllers/**/handler.rb')"
          ! grep -R -E 'config/environment|Rails\.application' app/controllers/*/*/handler.rb generated/lambda
      - run: bundle exec ruby lambda-test/aws_lambda_adapter_test.rb

  lambda-group-codegen:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails
      ORES_BUILD_TARGET: lambda
      ORES_LAMBDA_HANDLER_GRANULARITY: group
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: ruby bin/build-runtime
      - name: Verify grouped dispatch wraps generated endpoint handlers
        run: |
          grep -Fq '"handler_granularity": "group"' generated/lambda/manifest.json
          grep -Fq 'OresGenerated::Groups::Orders' generated/lambda/entrypoint.rb
          grep -Fq 'OresGenerated::EndpointHandlers::CancelOrder' generated/lambda/groups/orders/handler.rb
          test -f app/controllers/orders/show/handler.rb
          test -f app/controllers/orders/cancel/handler.rb
          test -z "$(git ls-files 'app/controllers/**/handler.rb')"
      - run: bundle exec ruby lambda-test/aws_lambda_adapter_test.rb

  graal-single-context-bundle:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: rails:test
      ORES_BUILD_TARGET: graal
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby+graalvm-34.0.1
          bundler-cache: false
      - name: Generate sibling handlers and one immutable Graal bundle
        run: truffleruby bin/build-runtime
      - name: Verify isolate-lifetime contract and flattened endpoint handlers
        run: |
          test -f generated/graal/handler.rb
          test -f generated/graal/manifest.json
          test -f app/controllers/users/show/handler.rb
          test -f app/controllers/orders/cancel/handler.rb
          grep -Fq '"context_lifetime": "isolate"' generated/graal/manifest.json
          grep -Fq '"request_state": "explicit-per-invocation"' generated/graal/manifest.json
          grep -Fq '"thread_identity_is_request_identity": false' generated/graal/manifest.json
          grep -Fq '"max_concurrency_per_isolate": 5' generated/graal/manifest.json
          grep -Fq '# --- app/controllers/users/show/handler.rb ---' generated/graal/handler.rb
          grep -Fq '# --- app/controllers/orders/cancel/handler.rb ---' generated/graal/handler.rb
          ! grep -E 'config/environment|Rails\.application|require_relative' generated/graal/handler.rb
          test -z "$(git ls-files 'app/controllers/**/handler.rb')"
      - name: Reuse one Ruby universe across five worker threads without request leakage
        run: |
          cat >/tmp/graal-reuse-smoke.rb <<'RUBY'
          require "json"
          require "thread"

          ORES_GS_HTTP = lambda do |payload|
            request = JSON.parse(payload.to_s)
            JSON.generate("ok" => true, "status" => 200, "body" => JSON.generate("target" => request.fetch("path")))
          end

          invoker = eval(File.read("generated/graal/handler.rb"), binding, "generated/graal/handler.rb")
          raise "Rails unexpectedly loaded" if defined?(Rails)

          health = OresGenerated::EndpointHandlers::Health
          original = health.method(:call)
          health.define_singleton_method(:call) do |request|
            raise "fiber local leaked" if Thread.current[:ores_poison]
            raise "thread variable leaked" if Thread.current.thread_variable_get(:ores_poison2)
            raise "ORES context mismatch" unless Ores::Context.current.equal?(request)
            Thread.current[:ores_poison] = request.fetch("request_id")
            Thread.current.thread_variable_set(:ores_poison2, request.fetch("request_id"))
            original.call(request)
          end

          queue = Queue.new
          1000.times { |i| queue << i }
          errors = Queue.new
          workers = 5.times.map do
            Thread.new do
              until queue.empty?
                i = queue.pop(true) rescue nil
                next unless i
                begin
                  request_id = "graal-reuse-#{i}"
                  response = JSON.parse(invoker.call(JSON.generate(
                    "request_id" => request_id,
                    "method" => "GET",
                    "path" => "/healthz",
                    "headers" => {}
                  )))
                  body = JSON.parse(response.fetch("body"))
                  raise "wrong request id" unless body.fetch("request_id") == request_id
                  raise "fiber cleanup failed" if Thread.current[:ores_poison]
                  raise "thread variable cleanup failed" if Thread.current.thread_variable_get(:ores_poison2)
                  raise "ORES context cleanup failed" if Ores::Context.current
                rescue => error
                  errors << error
                end
              end
            end
          end
          workers.each(&:join)
          raise errors.pop unless errors.empty?
          puts "one Ruby universe, five reusable workers, 1000 isolated invocations"
          RUBY
          truffleruby /tmp/graal-reuse-smoke.rb

  truffleruby-aws-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda image without Rails bundle
        run: docker build --platform linux/amd64 -f aws-lambda/Dockerfile -t ores-ror-truffleruby-lambda:test .
      - name: Verify Rails gem is not installed in lambda image
        run: |
          docker run --rm --entrypoint truffleruby ores-ror-truffleruby-lambda:test \
            -e 'abort "rails gem present" unless Gem::Specification.find_all_by_name("rails").empty?'
      - name: Install AWS Lambda Runtime Interface Emulator
        run: |
          curl --fail --location --output aws-lambda-rie \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x aws-lambda-rie
      - name: Boot Lambda runtime locally and invoke generated health handler
        run: |
          docker run --rm -d --name ores-ror-lambda -p 9000:8080 \
            -v "$PWD/aws-lambda-rie:/aws-lambda-rie:ro" \
            --entrypoint /aws-lambda-rie \
            ores-ror-truffleruby-lambda:test /var/runtime/bootstrap
          for n in $(seq 1 60); do
            if curl --fail --silent -H 'content-type: application/json' -d @aws-lambda/event-v2.json \
              http://127.0.0.1:9000/2015-03-31/functions/function/invocations >lambda-response.json; then break; fi
            sleep 1
          done
          cat lambda-response.json
          grep -q '"statusCode":200' lambda-response.json
          grep -q '"execution_mode":"lambda"' lambda-response.json
          grep -q 'truffleruby' lambda-response.json
      - if: failure()
        run: docker logs ores-ror-lambda || true
      - if: always()
        run: docker rm -f ores-ror-lambda >/dev/null 2>&1 || true
